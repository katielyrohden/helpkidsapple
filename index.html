<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HelpKids</title>
<meta name="description" content="App educativo infantil: alfabeto, números, formas, cores, animais, frutas, corpo e alimentos em inglês.">
<meta name="theme-color" content="#2E7D32">
<!-- iPhone/iPad: abre em tela cheia quando adicionado a Tela de Inicio -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HelpKids">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" href="icones/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Tela inicial -->
<section id="inicio" class="tela ativa">
  <div class="inicio-conteudo">
    <img class="welcome" src="img/welcome.png" alt="Welcome to Help Kids">
    <button id="btnPlay" class="botao-img play" aria-label="Play"><img src="img/play.png" alt=""></button>
  </div>
  <button id="btnJogador" class="cartao chip-jogador"></button>
  <button id="btnPais" class="botao-redondo canto-esquerdo" aria-label="Área dos pais"><img src="icones/engrenagem.svg" alt=""></button>
</section>

<!-- Menu de categorias -->
<section id="menu" class="tela">
  <img class="fundo" src="img/fundos_floresta.png" alt="">
  <div class="conteudo">
    <div class="rolagem"><div id="gradeMenu" class="grade-menu"></div></div>
    <div class="barra">
      <button id="menuRanking" class="botao-redondo" aria-label="Ranking"><img src="icones/trofeu.svg" alt=""></button>
      <span id="menuJogador" class="nome-barra"></span>
      <button class="botao-img nav voltar" data-volta="inicio" aria-label="Voltar"><img src="img/back.png" alt=""></button>
    </div>
  </div>
</section>

<!-- Figuras de uma categoria -->
<section id="categoria" class="tela">
  <img id="fundoCategoria" class="fundo" src="" alt="">
  <div class="conteudo">
    <div class="rolagem"><div id="gradeFiguras" class="grade-figuras"></div></div>
    <div class="barra">
      <div class="lugar-palavra"><span id="palavraCategoria" class="plaquinha" aria-live="polite"></span></div>
      <button class="botao-img nav voltar" data-volta="menu" aria-label="Voltar"><img src="img/back.png" alt=""></button>
      <button id="btnJogar" class="botao-img nav" aria-label="Jogar"><img src="img/next.png" alt=""></button>
    </div>
  </div>
</section>

<!-- Jogo: ouca e toque na figura certa -->
<section id="jogo" class="tela">
  <img class="fundo" src="img/fundos_floresta.png" alt="">
  <div class="conteudo">
    <div class="placar">
      <div class="placar-pontos">
        <span id="txtGanho" class="ganho"></span>
        <img id="imgEstrela" src="icones/estrela.svg" alt="">
        <span id="txtPontos">0</span>
      </div>
      <div id="txtProgresso" class="progresso"></div>
      <div id="txtLider" class="placar-linha"></div>
      <div id="txtRecorde" class="placar-linha"></div>
    </div>
    <div class="area-jogo">
      <div class="coluna-som">
        <button id="btnSom" class="botao-img som" aria-label="Ouvir de novo"><img src="img/som.png" alt=""></button>
        <span id="palavraJogo" class="plaquinha" aria-live="polite"></span>
      </div>
      <div id="gradeOpcoes" class="grade-opcoes"></div>
    </div>
    <div class="barra">
      <button class="botao-img nav voltar" data-volta="menu" aria-label="Voltar"><img src="img/back.png" alt=""></button>
    </div>
  </div>

  <!-- Very good! / Try Again -->
  <div id="aviso" class="camada aviso">
    <canvas id="fogos" class="fogos"></canvas>
    <div class="aviso-meio">
      <img id="avisoSeta" class="seta" src="icones/seta_repetir.svg" alt="">
      <span id="avisoTexto" class="aviso-texto"></span>
    </div>
  </div>

  <!-- fim da partida -->
  <div id="fim" class="camada escura">
    <canvas id="fogosFim" class="fogos"></canvas>
    <div class="camada-rolagem">
      <div class="fim-conteudo">
        <div id="fimTitulo" class="titulo-grande"></div>
        <div class="fim-estrelas">
          <img src="icones/estrela_vazia.svg" alt=""><img class="meio" src="icones/estrela_vazia.svg" alt=""><img src="icones/estrela_vazia.svg" alt="">
        </div>
        <div id="fimPontos" class="fim-pontos"></div>
        <div id="fimRecorde" class="fim-recorde">Novo recorde!</div>
        <div id="fimPosicao" class="fim-posicao"></div>
        <div class="fim-botoes">
          <button class="botao-img nav voltar" data-volta="menu" aria-label="Voltar"><img src="img/back.png" alt=""></button>
          <button id="fimRanking" class="botao-redondo grande" aria-label="Ranking"><img src="icones/trofeu.svg" alt=""></button>
          <button id="fimDeNovo" class="botao-img nav" aria-label="Jogar de novo"><img src="img/play.png" alt=""></button>
        </div>
      </div>
    </div>
  </div>

  <!-- escolha do nivel -->
  <div id="nivel" class="camada escura">
    <div class="camada-rolagem">
      <div class="nivel-conteudo">
        <div id="nivelJogador" class="nivel-jogador"></div>
        <div class="titulo-grande">Choose a level</div>
        <div id="botoesNivel" class="botoes-nivel"></div>
      </div>
    </div>
    <button class="botao-img nav voltar canto-baixo" data-volta="menu" aria-label="Voltar"><img src="img/back.png" alt=""></button>
  </div>
</section>

<!-- Quem vai jogar? -->
<section id="jogadores" class="tela">
  <img class="fundo" src="img/fundos_floresta.png" alt="">
  <div class="conteudo">
    <div class="cabecalho">
      <h1 class="titulo-tela">Quem vai jogar?</h1>
      <button id="jogadoresVoltar" class="botao-img nav" aria-label="Voltar"><img src="img/back.png" alt=""></button>
    </div>
    <div class="rolagem">
      <div id="listaJogadores" class="grade-jogadores"></div>
      <button id="novoJogador" class="cartao novo-jogador">+ Novo jogador</button>
      <p class="dica">Toque no nome para jogar · toque e segure para remover</p>
    </div>
  </div>
</section>

<!-- Ranking -->
<section id="ranking" class="tela">
  <img class="fundo" src="img/fundos_floresta.png" alt="">
  <div class="conteudo">
    <div class="cabecalho">
      <img class="icone-titulo" src="icones/trofeu.svg" alt="">
      <h1 class="titulo-tela">Ranking</h1>
      <button id="rankingVoltar" class="botao-img nav" aria-label="Voltar"><img src="img/back.png" alt=""></button>
    </div>
    <div id="filtrosRanking" class="filtros"></div>
    <div class="rolagem"><div id="listaRanking" class="lista-ranking"></div></div>
  </div>
</section>

<!-- Area dos pais -->
<section id="pais" class="tela tela-clara">
  <div class="conteudo">
    <div class="cabecalho">
      <h1 class="titulo-tela escuro">Área dos pais</h1>
      <button class="botao-img nav voltar" data-volta="inicio" aria-label="Voltar"><img src="img/back.png" alt=""></button>
    </div>
    <div class="rolagem">
      <div class="pais-conteudo">
        <div id="paisJogador" class="pais-jogador"></div>
        <label class="cartao-pais linha-som">
          <span>Sons ligados</span>
          <input id="somLigado" type="checkbox" class="chave">
        </label>
        <div id="listaCategoriasPais"></div>
        <button id="zerar" class="botao-texto">Zerar progresso</button>
        <p class="creditos">Figuras de Corpo e Alimentos: OpenMoji (openmoji.org), licença CC BY-SA 4.0.</p>
      </div>
    </div>
  </div>
</section>

<!-- caixa de dialogo (nome do jogador, continha dos pais, confirmacoes) -->
<div id="dialogo" class="dialogo-fundo" hidden>
  <form id="dialogoCaixa" class="dialogo" method="dialog">
    <div id="dialogoTitulo" class="dialogo-titulo"></div>
    <div id="dialogoTexto" class="dialogo-texto"></div>
    <input id="dialogoCampo" class="dialogo-campo" autocomplete="off">
    <div class="dialogo-botoes">
      <button type="button" id="dialogoCancelar" class="botao-texto">Cancelar</button>
      <button type="submit" id="dialogoOk" class="botao-texto forte">OK</button>
    </div>
  </form>
</div>

<div id="aviso-curto" class="toast" role="status"></div>

<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
