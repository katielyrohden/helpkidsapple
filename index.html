<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HelpKids</title>
<meta name="description" content="App educativo infantil: alfabeto, números, formas, cores, animais, frutas, corpo e alimentos em inglês.">
<meta name="theme-color" content="#2E7D32">
<!-- iPhone/iPad: abre em tela cheia quando adicionado a Tela de Inicio -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HelpKids">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" href="icones/icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Tela inicial -->
<section id="inicio" class="tela ativa">
  <!-- cenario das criancas com a placa (fundo_inicio); em pe ele fica sobre o campo (fundos_floresta) -->
  <img class="fundo inicio-campo" src="img/fundos_floresta.webp" alt="">
  <div class="inicio-lado esq"></div><div class="inicio-lado dir"></div>
  <img class="inicio-largo" src="img/fundo_inicio_largo.webp" alt="">
  <img class="fundo inicio-cena" src="img/fundo_inicio.webp" alt="Welcome to Help Kids">
  <!-- nuvem "Quem vai jogar?" com o nome do jogador escolhido numa plaquinha pendurada embaixo -->
  <button id="btnJogador" class="titulo-inicio" aria-label="Quem vai jogar?"><img id="nuvemInicio" src="img/titulo_quem_vai_jogar.webp" alt=""><span id="txtJogador" class="nome-nuvem"></span></button>
  <button id="btnPais" class="botao-redondo engrenagem" aria-label="Área dos pais"><img src="img/engrenagem.webp" alt=""></button>
  <button id="btnPlay" class="botao-img play-inicio" aria-label="Play"><img src="img/play.webp" alt=""></button>
</section>

<!-- Menu de categorias -->
<section id="menu" class="tela">
  <img class="fundo" src="img/fundos_floresta.webp" alt="">
  <div class="conteudo">
    <div class="topo">
      <img class="logo" src="img/logo.webp" alt="HelpKids">
      <h1 class="titulo"><img src="img/titulo_escolha_atividade.webp" alt="Escolha uma atividade"></h1>
      <span class="topo-lado"></span>
    </div>
    <div class="rolagem"><div id="gradeMenu" class="grade-menu"></div></div>
    <div class="barra">
      <button id="menuRanking" class="contador" aria-label="Ranking"><img src="img/trofeu.webp" alt=""><span id="menuPontos">0</span></button>
      <span class="espaco"></span>
      <button class="botao-img nav voltar" data-volta="inicio" aria-label="Voltar"><img src="img/back.webp" alt=""></button>
    </div>
  </div>
</section>

<!-- Figuras de uma categoria -->
<section id="categoria" class="tela">
  <img id="fundoCategoria" class="fundo" src="" alt="">
  <div class="veu"></div>
  <div class="conteudo">
    <div class="rolagem"><div id="gradeFiguras" class="grade-figuras"></div></div>
    <div class="barra">
      <div class="lugar-palavra"><span id="palavraCategoria" class="plaquinha" aria-live="polite"></span></div>
      <button class="botao-img nav voltar" data-volta="menu" aria-label="Voltar"><img src="img/back.webp" alt=""></button>
      <button id="btnJogar" class="botao-img nav" aria-label="Jogar"><img src="img/next.webp" alt=""></button>
    </div>
  </div>
</section>

<!-- Jogo: ouca e toque na figura certa -->
<section id="jogo" class="tela">
  <img class="fundo" src="img/fundos_floresta.webp" alt="">
  <div class="conteudo">
    <div class="placar">
      <div class="placar-pontos">
        <span id="txtGanho" class="ganho"></span>
        <img id="imgEstrela" src="img/estrela_placar.webp" alt="">
        <span id="txtPontos">0</span>
      </div>
      <div id="txtProgresso" class="progresso"></div>
      <div id="txtLider" class="placar-linha"></div>
      <div id="txtRecorde" class="placar-linha"></div>
    </div>
    <div class="area-jogo">
      <div class="coluna-som">
        <button id="btnSom" class="botao-img som" aria-label="Ouvir de novo"><img src="img/som.webp" alt=""></button>
        <span id="palavraJogo" class="plaquinha" aria-live="polite"></span>
      </div>
      <div id="gradeOpcoes" class="grade-opcoes"></div>
    </div>
    <div class="barra">
      <button class="botao-img nav voltar" data-volta="menu" aria-label="Voltar"><img src="img/back.webp" alt=""></button>
    </div>
  </div>

  <!-- Very good! / Try Again -->
  <div id="aviso" class="camada aviso">
    <canvas id="fogos" class="fogos"></canvas>
    <div class="aviso-meio">
      <img id="avisoSeta" class="seta" src="img/seta_repetir.webp" alt="">
      <span id="avisoTexto" class="aviso-texto"></span>
    </div>
  </div>

  <!-- fim da partida -->
  <div id="fim" class="camada escura">
    <canvas id="fogosFim" class="fogos"></canvas>
    <div class="camada-rolagem">
      <div class="fim-conteudo">
        <div id="fimTitulo" class="titulo-grande"></div>
        <div class="fim-estrelas">
          <img src="img/estrela_vazia.webp" alt=""><img class="meio" src="img/estrela_vazia.webp" alt=""><img src="img/estrela_vazia.webp" alt="">
        </div>
        <div id="fimPontos" class="fim-pontos"></div>
        <div id="fimRecorde" class="fim-recorde">Novo recorde!</div>
        <div id="fimPosicao" class="fim-posicao"></div>
        <div class="fim-botoes">
          <button class="botao-img nav voltar" data-volta="menu" aria-label="Voltar"><img src="img/back.webp" alt=""></button>
          <button id="fimRanking" class="botao-redondo grande" aria-label="Ranking"><img src="img/trofeu.webp" alt=""></button>
          <button id="fimDeNovo" class="botao-img nav" aria-label="Jogar de novo"><img src="img/play.webp" alt=""></button>
        </div>
      </div>
    </div>
  </div>

  <!-- escolha do nivel -->
  <div id="nivel" class="camada escura">
    <div class="camada-rolagem">
      <div class="nivel-conteudo">
        <div id="nivelJogador" class="nivel-jogador"></div>
        <div class="titulo-grande">Choose a level</div>
        <div id="botoesNivel" class="botoes-nivel"></div>
      </div>
    </div>
    <button class="botao-img nav voltar canto-baixo" data-volta="menu" aria-label="Voltar"><img src="img/back.webp" alt=""></button>
  </div>
</section>

<!-- Quem vai jogar? -->
<section id="jogadores" class="tela">
  <img class="fundo" src="img/fundos_floresta.webp" alt="">
  <div class="conteudo">
    <div class="topo">
      <img class="logo" src="img/logo.webp" alt="HelpKids">
      <h1 class="titulo"><img src="img/titulo_quem_vai_jogar.webp" alt="Quem vai jogar?"></h1>
      <span class="topo-lado"><button id="jogadoresVoltar" class="botao-img nav" aria-label="Voltar"><img src="img/back.webp" alt=""></button></span>
    </div>
    <div class="rolagem">
      <div id="listaJogadores" class="grade-jogadores"></div>
      <button id="novoJogador" class="botao-arte novo-jogador" aria-label="+ Novo jogador"><img src="img/botao_novo_jogador.webp" alt=""></button>
      <p class="dica">Toque no nome para jogar · toque e segure para remover</p>
    </div>
  </div>
</section>

<!-- Ranking -->
<section id="ranking" class="tela">
  <img class="fundo" src="img/fundos_floresta.webp" alt="">
  <div class="conteudo">
    <div class="topo">
      <img class="logo" src="img/logo.webp" alt="HelpKids">
      <h1 class="titulo"><img src="img/titulo_ranking.webp" alt="Ranking"></h1>
      <span class="topo-lado"><button id="rankingVoltar" class="botao-img nav" aria-label="Voltar"><img src="img/back.webp" alt=""></button></span>
    </div>
    <div id="filtrosRanking" class="filtros"></div>
    <div class="rolagem"><div id="listaRanking" class="lista-ranking"></div></div>
  </div>
</section>

<!-- Area dos pais -->
<section id="pais" class="tela tela-clara">
  <div class="conteudo">
    <div class="cabecalho">
      <h1 class="titulo titulo-pais"><img src="img/titulo_area_dos_pais.webp" alt="Área dos pais"></h1>
      <button class="botao-img nav voltar" data-volta="inicio" aria-label="Voltar"><img src="img/back.webp" alt=""></button>
    </div>
    <div class="rolagem">
      <div class="pais-conteudo">
        <div id="paisJogador" class="pais-jogador"></div>
        <label class="cartao-pais linha-som">
          <span>Sons ligados</span>
          <input id="somLigado" type="checkbox" class="chave">
        </label>
        <div id="listaCategoriasPais"></div>
        <button id="zerar" class="botao-texto">Zerar progresso</button>
        <p class="creditos">Figuras da mão e do olho: OpenMoji (openmoji.org), licença CC BY-SA 4.0. Letra Fredoka: SIL Open Font License (fontes/OFL.txt).</p>
      </div>
    </div>
  </div>
</section>

<!-- caixa de dialogo (nome do jogador, continha dos pais, confirmacoes) -->
<div id="dialogo" class="dialogo-fundo" hidden>
  <form id="dialogoCaixa" class="dialogo" method="dialog">
    <img class="dialogo-estrela" src="img/estrela_placar.webp" alt="">
    <button type="button" id="dialogoFechar" class="dialogo-fechar" aria-label="Fechar"><img src="img/fechar.webp" alt=""></button>
    <img id="dialogoTituloImg" class="dialogo-titulo-img" alt="">
    <div id="dialogoTitulo" class="dialogo-titulo"></div>
    <div id="dialogoTexto" class="dialogo-texto"></div>
    <input id="dialogoCampo" class="dialogo-campo" autocomplete="off">
    <div class="dialogo-botoes">
      <button type="button" id="dialogoCancelar" class="botao-arte" aria-label="Cancelar"><img src="img/botao_cancelar.webp" alt=""></button>
      <button type="submit" id="dialogoOk" class="botao-arte" aria-label="OK"><img id="dialogoOkImg" src="img/botao_ok.webp" alt=""></button>
    </div>
  </form>
</div>

<div id="aviso-curto" class="toast" role="status"></div>

<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
